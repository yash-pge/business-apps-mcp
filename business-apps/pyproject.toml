[build-system]
requires = ["setuptools>=68.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "business-apps-search"
# Four-part release number, not an IP address. Keep in sync with setup.py.
version = "1.0.0.0"  # NOSONAR - python:S1313 false positive (version, not an IP)
description = "Performs search on the Business Apps knowledge base."
requires-python = ">=3.11"
dependencies = [
    # MCP server and protocol (FastMCP lives in mcp.server.fastmcp). Same pin as
    # ecm-mcp-server: mcp 2.0 renamed FastMCP, so stay on 1.x until migrated.
    "mcp[cli]>=1.23.0,<2.0.0",
    # Environment variable loading.
    "python-dotenv>=1.0.0",
    # HTTP clients. requests calls the retrieve API; httpx ships with mcp.
    "requests>=2.31.0",
    "httpx>=0.27.0",
    # Entra ID certificate credential.
    "azure-identity>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools]
# Flat layout: server.py is a top-level module and tools/ is the package.
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
source = ["."]
relative_files = true
omit = [".venv/*", "build/*", "test/*", "setup.py"]
