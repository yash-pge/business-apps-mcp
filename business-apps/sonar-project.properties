# Sources and tests (same layout as ecm-mcp-server)
sonar.sources=server.py,tools
sonar.tests=./test/
sonar.python.version=3.11

# Exclude virtualenvs and build output so third-party files are not analyzed.
sonar.exclusions=webapp/**,.venv/**,build/**,**/*.egg-info/**,**/__pycache__/**

# Coverage. Generate coverage.xml before the scan:
#   pytest test --cov --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

# Set the real project key when the SonarQube project is created.
sonar.projectKey=3561-business-apps-search

# Provide the token via the SONAR_TOKEN environment variable; do not commit it.
sonar.host.url=https://sonarqube.io.pge.com
