<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 14px; fill: #475569; }
      .zone { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .boxT { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .boxS { font-size: 12px; fill: #334155; }
      .lbl { font-size: 12px; fill: #0f172a; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .note { font-size: 12.5px; fill: #1e293b; }
      .noteT { font-size: 14px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="30" y="40" class="title">Business Apps MCP server: authentication flow (same as ecm-mcp-server)</text>
  <text x="30" y="64" class="sub">The MCP server never holds AWS credentials. It proves who it is to Entra ID with a certificate; the retrieve API holds the AWS access.</text>

  <!-- Zones -->
  <rect x="20" y="90" width="230" height="430" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="35" y="112" class="zone" fill="#475569">CALLER</text>

  <rect x="265" y="90" width="300" height="430" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="280" y="112" class="zone" fill="#1d4ed8">MCP SERVER (no AWS credentials)</text>

  <rect x="580" y="90" width="230" height="430" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="595" y="112" class="zone" fill="#6d28d9">MICROSOFT ENTRA ID</text>

  <rect x="825" y="90" width="355" height="430" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="840" y="112" class="zone" fill="#c2410c">AWS (backend account)</text>

  <!-- Caller boxes -->
  <rect x="40" y="135" width="190" height="70" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="135" y="163" text-anchor="middle" class="boxT">AI client</text>
  <text x="135" y="183" text-anchor="middle" class="boxS">Kiro / VS Code Copilot</text>

  <rect x="40" y="290" width="190" height="90" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="135" y="316" text-anchor="middle" class="boxT">Portkey MCP Gateway</text>
  <text x="135" y="336" text-anchor="middle" class="boxS">+ Lambda Authorizer</text>
  <text x="135" y="354" text-anchor="middle" class="boxS">checks the caller</text>
  <text x="135" y="370" text-anchor="middle" class="boxS">(incoming auth)</text>

  <!-- MCP server boxes -->
  <rect x="285" y="135" width="260" height="70" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="415" y="160" text-anchor="middle" class="boxT">search_business_apps tool</text>
  <text x="415" y="180" text-anchor="middle" class="boxS">mcp_search_business_apps.py</text>
  <text x="415" y="196" text-anchor="middle" class="boxS">binds to 127.0.0.1 unless MCP_HOST set</text>

  <rect x="285" y="240" width="260" height="105" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="415" y="263" text-anchor="middle" class="boxT">get_access_token()</text>
  <text x="415" y="281" text-anchor="middle" class="boxS">business_apps_token.py</text>
  <text x="415" y="300" text-anchor="middle" class="boxS">ENTRA_TENANT_ID, ENTRA_CLIENT_ID,</text>
  <text x="415" y="316" text-anchor="middle" class="boxS">ENTRA_SCOPE</text>
  <text x="415" y="334" text-anchor="middle" class="boxS" fill="#b91c1c">secrets: CERTIFICATE_DATA + PASSWORD</text>

  <rect x="285" y="385" width="260" height="105" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="415" y="408" text-anchor="middle" class="boxT">search_business_apps_vectordb()</text>
  <text x="415" y="426" text-anchor="middle" class="boxS">business_apps_search.py</text>
  <text x="415" y="445" text-anchor="middle" class="boxS">POST API_ENDPOINT</text>
  <text x="415" y="462" text-anchor="middle" class="boxS">Authorization: Bearer &lt;token&gt;</text>
  <text x="415" y="479" text-anchor="middle" class="boxS">body: KB_ID + query (Bedrock shape)</text>

  <!-- Entra box -->
  <rect x="600" y="240" width="190" height="105" rx="10" fill="#ffffff" stroke="#7c3aed"/>
  <text x="695" y="265" text-anchor="middle" class="boxT">Entra ID</text>
  <text x="695" y="285" text-anchor="middle" class="boxS">Amplify app registration</text>
  <text x="695" y="303" text-anchor="middle" class="boxS">verifies the certificate</text>
  <text x="695" y="321" text-anchor="middle" class="boxS">issues token for ENTRA_SCOPE</text>

  <!-- AWS boxes -->
  <rect x="845" y="385" width="315" height="105" rx="10" fill="#ffffff" stroke="#ea580c"/>
  <text x="1002" y="408" text-anchor="middle" class="boxT">Retrieve API (API_ENDPOINT)</text>
  <text x="1002" y="428" text-anchor="middle" class="boxS">1) validates the Entra token (issuer, audience, app)</text>
  <text x="1002" y="446" text-anchor="middle" class="boxS">2) runs with its OWN IAM role</text>
  <text x="1002" y="464" text-anchor="middle" class="boxS">   (this is where AWS authentication happens)</text>
  <text x="1002" y="482" text-anchor="middle" class="boxS">3) calls bedrock-agent-runtime.retrieve()</text>

  <rect x="845" y="135" width="315" height="105" rx="10" fill="#ffffff" stroke="#ea580c"/>
  <text x="1002" y="160" text-anchor="middle" class="boxT">Bedrock Knowledge Base</text>
  <text x="1002" y="180" text-anchor="middle" class="boxS">KB_ID (e.g. QKQDEAJBG9)</text>
  <text x="1002" y="198" text-anchor="middle" class="boxS">Titan embeddings + OpenSearch Serverless</text>
  <text x="1002" y="218" text-anchor="middle" class="boxS">allowed only for the API's IAM role</text>

  <!-- Arrows with numbered steps -->
  <!-- 1 client -> gateway -->
  <line x1="120" y1="205" x2="120" y2="288" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="98" cy="246" r="11" fill="#0f172a"/><text x="98" y="251" text-anchor="middle" class="num">1</text>
  <text x="128" y="244" class="lbl">MCP request</text>

  <!-- 2 gateway -> tool -->
  <path d="M230,320 C260,320 255,175 283,172" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="252" cy="250" r="11" fill="#0f172a"/><text x="252" y="255" text-anchor="middle" class="num">2</text>

  <!-- 3 tool -> token -->
  <line x1="415" y1="205" x2="415" y2="238" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="393" cy="222" r="11" fill="#0f172a"/><text x="393" y="227" text-anchor="middle" class="num">3</text>

  <!-- 4 token -> Entra -->
  <line x1="545" y1="275" x2="598" y2="275" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="571" cy="258" r="11" fill="#0f172a"/><text x="571" y="263" text-anchor="middle" class="num">4</text>
  <text x="552" y="292" class="lbl" font-size="11">cert sign-in</text>

  <!-- 5 Entra -> token -->
  <line x1="598" y1="320" x2="547" y2="320" stroke="#15803d" stroke-width="2" marker-end="url(#arrowG)"/>
  <circle cx="571" cy="337" r="11" fill="#15803d"/><text x="571" y="342" text-anchor="middle" class="num">5</text>
  <text x="552" y="358" class="lbl" font-size="11" fill="#15803d">access token</text>

  <!-- 6 token -> search -->
  <line x1="415" y1="345" x2="415" y2="383" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="393" cy="364" r="11" fill="#0f172a"/><text x="393" y="369" text-anchor="middle" class="num">6</text>

  <!-- 7 search -> API -->
  <line x1="545" y1="425" x2="843" y2="425" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="694" cy="408" r="11" fill="#0f172a"/><text x="694" y="413" text-anchor="middle" class="num">7</text>
  <text x="640" y="443" class="lbl">HTTPS + Bearer token</text>

  <!-- 8 API -> KB -->
  <line x1="960" y1="385" x2="960" y2="242" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="938" cy="313" r="11" fill="#0f172a"/><text x="938" y="318" text-anchor="middle" class="num">8</text>
  <text x="868" y="300" class="lbl" font-size="11">IAM role</text>
  <text x="868" y="334" class="lbl" font-size="11">retrieve</text>

  <!-- 9 KB -> API -->
  <line x1="1045" y1="242" x2="1045" y2="383" stroke="#15803d" stroke-width="2" marker-end="url(#arrowG)"/>
  <circle cx="1067" cy="313" r="11" fill="#15803d"/><text x="1067" y="318" text-anchor="middle" class="num">9</text>
  <text x="1082" y="318" class="lbl" font-size="11" fill="#15803d">chunks</text>

  <!-- 10 API -> search -> client -->
  <path d="M843,470 L547,470" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrowG)"/>
  <circle cx="694" cy="487" r="11" fill="#15803d"/><text x="694" y="492" text-anchor="middle" class="num">10</text>
  <text x="712" y="491" class="lbl" font-size="11" fill="#15803d">retrievalResults</text>
  <path d="M285,470 C150,470 90,420 90,382" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowG)"/>
  <text x="150" y="462" class="lbl" font-size="11" fill="#15803d">results to client</text>

  <!-- Legend / explanation -->
  <rect x="20" y="540" width="1160" height="205" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="566" class="noteT">Steps</text>
  <text x="40" y="588" class="note">1-2  The client calls the MCP server through the gateway. The gateway and Lambda Authorizer decide who may call (incoming auth). The server does not check callers.</text>
  <text x="40" y="608" class="note">3-5  The server signs in to Entra ID with its certificate (no client secret) and gets an access token for ENTRA_SCOPE. Token and certificate are never logged.</text>
  <text x="40" y="628" class="note">6-7  The server sends the query to the retrieve API (API_ENDPOINT) with the token as a Bearer token.</text>
  <text x="40" y="648" class="note">8-9  The retrieve API checks the token, then uses ITS OWN AWS IAM role to search the Bedrock Knowledge Base. This is the only place AWS authentication happens.</text>
  <text x="40" y="668" class="note">10   The chunks come back to the MCP server, which drops internal fields (S3 paths, bookkeeping keys) and returns them to the client.</text>

  <text x="40" y="698" class="noteT">How AWS authentication works</text>
  <text x="40" y="720" class="note">The MCP server has no AWS keys, SSO profile or role. AWS is reached only by the retrieve API, which runs with an IAM role allowed bedrock:Retrieve on the KB.</text>
  <text x="40" y="738" class="note">Entra proves the MCP server's identity to that API. Still needed: the API_ENDPOINT URL and the Amplify ENTRA_SCOPE enabled.</text>
</svg>
